name: CI
on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install linters
      run: pip install ruff pylint black mypy
    - name: Check 2-space indent
      run: python -m pylint --disable=all -e W0311 -e C0303 --indent-string='  ' fairhire/ || true
    - name: Format check (black)
      run: black --check --line-length 100 fairhire/ tests/
    - name: Lint with ruff
      run: ruff check fairhire/ tests/
    - name: Type check (mypy)
      run: mypy --strict --ignore-missing-imports fairhire/

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install deps
      run: |
        pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run tests with coverage
      run: pytest tests/ -v --tb=short --cov=fairhire --cov-report=term-missing --cov-fail-under=70
      env:
        REDIS_URL: redis://localhost:6379
