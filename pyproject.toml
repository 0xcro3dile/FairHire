[project]
name = "fairhire"
version = "0.1.0"
description = "AI Hiring Bias Detection - Multi-Agent Auditor"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.109",
  "uvicorn>=0.27",
  "aif360>=0.6",
  "fairlearn>=0.10",
  "lime>=0.2",
  "langgraph>=0.2",
  "redis>=5.0",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "numpy>=1.26",
  "pydantic>=2.0",
  "psycopg[binary,pool]>=3.1",
  "orjson>=3.9",
  "structlog>=24.0",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "mypy>=1.8", "black>=24.0", "pytest-cov>=4.1"]
dashboard = ["streamlit>=1.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fairhire"]

[tool.coverage.run]
omit = ["fairhire/dashboard/*"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__"]
